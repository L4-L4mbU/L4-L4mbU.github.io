<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{APP_NAME}} MOD APK | MURMU MODS</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 200, 255, 0.12), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(140, 0, 255, 0.12), transparent 35%),
        #070b14;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 20px;

      background: rgba(10, 15, 28, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0, 220, 255, 0.18);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 700;
    }

    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
    }

    .home-btn {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 220, 255, 0.25);

      font-size: 22px;
    }

    /* MAIN */
    main {
      max-width: 900px;
      margin: auto;
      padding: 45px 18px;
    }

    .app-hero {
      text-align: center;
      padding: 35px 20px;

      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(0, 220, 255, 0.2);

      border-radius: 24px;

      box-shadow:
        0 0 35px rgba(0, 200, 255, 0.06),
        inset 0 0 25px rgba(255, 255, 255, 0.015);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .app-icon {
      width: 105px;
      height: 105px;

      border-radius: 24px;
      object-fit: cover;

      border: 1px solid rgba(255, 255, 255, 0.15);

      box-shadow:
        0 0 30px rgba(0, 200, 255, 0.14);
    }

    h1 {
      margin-top: 18px;
      font-size: 32px;
    }

    .version {
      margin-top: 8px;
      color: #9ba7bd;
      font-size: 14px;
    }

    .description {
      max-width: 650px;
      margin: 15px auto 0;
      color: #b9c2d3;
      line-height: 1.6;
      font-size: 15px;
    }

    /* DOWNLOAD */
    .download-btn {
      display: inline-block;

      margin-top: 25px;
      padding: 14px 32px;

      border-radius: 14px;

      background: linear-gradient(
        135deg,
        #00c6ff,
        #7b2cff
      );

      font-size: 16px;
      font-weight: 700;

      box-shadow:
        0 0 25px rgba(0, 198, 255, 0.2);

      transition: 0.25s;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 35px rgba(0, 198, 255, 0.3);
    }

    /* SECTIONS */
    .section {
      margin-top: 25px;
      padding: 25px;

      background: rgba(255, 255, 255, 0.04);

      border: 1px solid rgba(140, 0, 255, 0.18);
      border-radius: 20px;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .section h2 {
      margin-bottom: 18px;
      font-size: 21px;
    }

    .features {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .features li {
      padding: 13px 15px;

      background: rgba(255, 255, 255, 0.035);
      border-radius: 12px;

      border-left: 2px solid #00c6ff;

      color: #c8d0df;
    }

    /* SCREENSHOT */
    .screenshot {
      width: 100%;
      max-height: 600px;

      object-fit: contain;

      border-radius: 15px;

      border: 1px solid rgba(0, 220, 255, 0.15);
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px 15px;

      color: #707b90;
      font-size: 13px;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      main {
        padding: 30px 14px;
      }

      .app-hero {
        padding: 28px 16px;
      }

      h1 {
        font-size: 27px;
      }

      .app-icon {
        width: 90px;
        height: 90px;
      }

      .section {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">

      <a href="../index.html" class="brand">

        <img
          src="{{LOGO_URL}}"
          alt="MURMU MODS"
        >

        <span>MURMU MODS</span>

      </a>

      <a href="../index.html" class="home-btn">
        ←
      </a>

    </div>
  </header>


  <!-- MAIN -->
  <main>

    <!-- APP HERO -->
    <section class="app-hero">

      <img
        class="app-icon"
        src="{{ICON_URL}}"
        alt="{{APP_NAME}}"
      >

      <h1>{{APP_NAME}}</h1>

      <div class="version">
        Version {{VERSION}}
      </div>

      <p class="description">
        {{DESCRIPTION}}
      </p>

      <a
        class="download-btn"
        href="{{DOWNLOAD_URL}}"
        target="_blank"
        rel="noopener"
      >
        ⬇ Download APK
      </a>

    </section>


    <!-- FEATURES -->
    <section class="section">

      <h2>✨ Features</h2>

      <ul class="features">

        <li>{{FEATURE_1}}</li>
        <li>{{FEATURE_2}}</li>
        <li>{{FEATURE_3}}</li>
        <li>{{FEATURE_4}}</li>
        <li>{{FEATURE_5}}</li>
        <li>{{FEATURE_6}}</li>

      </ul>

    </section>


    <!-- SCREENSHOT -->
    <section class="section">

      <h2>📸 Screenshot</h2>

      <img
        class="screenshot"
        src="{{SCREENSHOT_URL}}"
        alt="{{APP_NAME}} Screenshot"
      >

    </section>

  </main>


  <!-- FOOTER -->
  <footer>
    © 2026 MURMU MODS • All Rights Reserved
  </footer>

</body>
</html>
